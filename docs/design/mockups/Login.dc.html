<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Logowanie i zaproszenie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Inter',system-ui,sans-serif}button,input{font-family:inherit}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#000;color:#fff;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;padding:96px 24px 32px;overflow:hidden">
  <div style="display:flex;gap:6px">
    <span style="width:14px;height:14px;border-radius:5px;background:#FF8A1F"></span>
    <span style="width:14px;height:14px;border-radius:5px;background:#5BB8E0"></span>
    <span style="width:14px;height:14px;border-radius:5px;background:#8CE563"></span>
  </div>
  <h1 style="margin:20px 0 0;font-size:36px;font-weight:700;letter-spacing:-0.02em;line-height:1.1">Małe kroki,<br>każdego dnia.</h1>
  <p style="margin:12px 0 0;font-size:16px;line-height:1.45;color:#A7A7B0">Zostałeś zaproszony. Ustaw hasło, aby zacząć.</p>

  <div style="margin-top:40px;display:flex;flex-direction:column;gap:12px">
    <div style="padding:14px 16px;border-radius:18px;background:#111114">
      <label for="e" style="display:block;font-size:12px;color:#A7A7B0">E-mail</label>
      <input id="e" type="email" value="ania@example.com" style="width:100%;box-sizing:border-box;margin-top:4px;padding:0;border:0;background:transparent;color:#fff;font-size:17px;outline:none">
    </div>
    <div style="padding:14px 16px;border-radius:18px;background:#111114">
      <label for="p" style="display:block;font-size:12px;color:#A7A7B0">Hasło (min. 8 znaków)</label>
      <input id="p" type="password" value="haslohaslo" style="width:100%;box-sizing:border-box;margin-top:4px;padding:0;border:0;background:transparent;color:#fff;font-size:17px;outline:none">
    </div>
  </div>

  <button style="margin-top:20px;height:56px;border-radius:28px;border:0;background:#FF8A1F;color:#000;font-size:17px;font-weight:600">Ustaw hasło i wejdź</button>
  <div style="margin-top:16px;text-align:center;font-size:14px;color:#A7A7B0">Masz już konto? <span style="color:#fff;font-weight:600">Zaloguj się</span></div>
  <div style="text-align:center;margin-top:12px;font-size:14px;color:#A7A7B0">Nie pamiętasz hasła? <span style="color:#fff;font-weight:600">Zresetuj</span></div>

  <div style="margin-top:auto;font-size:12px;line-height:1.5;color:#8A8A94;text-align:center">Rejestracja tylko na zaproszenie. Twoje dane są prywatne i widoczne tylko dla Ciebie.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
